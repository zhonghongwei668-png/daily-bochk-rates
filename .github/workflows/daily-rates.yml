name: Daily BOCHK USD rates shot

on:
  push:
    branches: [main]
  schedule:
    # 香港时间 08:30 起每小时一次（UTC 00:30 ~ 15:30），失败自动重试
    - cron: "30 0-15 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-rates-shot
  cancel-in-progress: false

jobs:
  rates-shot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 幂等守卫：今天已成功发布过截图则跳过，避免每小时重复轰炸群
      - name: Guard — skip if today already published
        id: guard
        run: |
          DATE="$(TZ='Asia/Hong_Kong' date +%F)"
          URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/shots/$DATE.png"
          code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "$URL")"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          if [ "$code" = "200" ]; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "今日截图已发布（HTTP 200），跳过。"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
            echo "今日截图尚未发布（HTTP $code），继续执行。"
          fi

      - name: Install CJK fonts
        if: steps.guard.outputs.already_published != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk >/dev/null
          fc-cache -f >/dev/null

      - name: Resolve Chrome binary
        if: steps.guard.outputs.already_published != 'true'
        id: chrome
        run: |
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          echo "Using Chrome: $CHROME"
          echo "chrome=$CHROME" >> "$GITHUB_OUTPUT"

      - name: Fetch rates data
        if: steps.guard.outputs.already_published != 'true'
        run: python3 scripts/fetch_rates.py
        env:
          WORKDIR: "${{ runner.temp }}/work"

      - name: Capture real page
        if: steps.guard.outputs.already_published != 'true'
        run: |
          mkdir -p "$WORKDIR"
          "$CHROME" --headless=new --disable-gpu --no-sandbox \
            --window-size=1400,1560 --virtual-time-budget=20000 \
            --hide-scrollbars \
            --screenshot="$WORKDIR/page_raw.png" \
            "https://www.bochk.com/tc/investment/rates/usdrates.html"
          ls -la "$WORKDIR/page_raw.png"
        env:
          CHROME: "${{ steps.chrome.outputs.chrome }}"
          WORKDIR: "${{ runner.temp }}/work"

      - name: Build composite
        if: steps.guard.outputs.already_published != 'true'
        run: python3 scripts/composite.py
        env:
          WORKDIR: "${{ runner.temp }}/work"

      - name: Capture composite
        if: steps.guard.outputs.already_published != 'true'
        run: |
          "$CHROME" --headless=new --disable-gpu --no-sandbox \
            --window-size=1400,1690 --hide-scrollbars \
            --screenshot="$WORKDIR/bochk_usd_full.png" \
            "file://$WORKDIR/composite.html"
          ls -la "$WORKDIR/bochk_usd_full.png"
        env:
          CHROME: "${{ steps.chrome.outputs.chrome }}"
          WORKDIR: "${{ runner.temp }}/work"

      - name: Stage shot for Pages
        if: steps.guard.outputs.already_published != 'true'
        id: stage
        run: |
          DATE="$(TZ='Asia/Hong_Kong' date +%F)"
          SHOT_DIR="gh-pages-out/shots"
          mkdir -p "$SHOT_DIR"
          cp "$WORKDIR/bochk_usd_full.png" "$SHOT_DIR/$DATE.png"
          touch "gh-pages-out/.nojekyll"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "file=shots/$DATE.png" >> "$GITHUB_OUTPUT"
          echo "url=https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/shots/$DATE.png" >> "$GITHUB_OUTPUT"
        env:
          WORKDIR: "${{ runner.temp }}/work"

      - name: Deploy to gh-pages
        if: steps.guard.outputs.already_published != 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./gh-pages-out
          publish_branch: gh-pages
          keep_files: true
          enable_jekyll: false

      - name: Wait for image URL reachable
        if: steps.guard.outputs.already_published != 'true'
        run: |
          URL="${{ steps.stage.outputs.url }}"
          echo "Polling: $URL"
          for i in $(seq 1 48); do
            code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$URL")"
            if [ "$code" = "200" ]; then
              echo "reachable after ${i} attempts (HTTP 200)"
              exit 0
            fi
            sleep 5
          done
          echo "ERROR: image URL not reachable after timeout; treat as failure for retry" >&2
          exit 1

      - name: Send DingTalk
        if: steps.guard.outputs.already_published != 'true'
        run: python3 scripts/send_dingtalk.py
        env:
          WORKDIR: "${{ runner.temp }}/work"
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
          IMAGE_URL: ${{ steps.stage.outputs.url }}

      # 失败告警：任何一步失败 → 推送报错到钉钉，附 run 链接
      - name: Alert DingTalk on failure
        if: failure()
        run: python3 scripts/send_failure.py
        env:
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
          RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
